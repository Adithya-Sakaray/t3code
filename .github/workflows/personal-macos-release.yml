# Personal fork release: publish @adithyasak/t3 plus unsigned macOS DMG and
# Windows NSIS at the same version. One dispatch or one personal-v* tag
# updates npm and both desktop artifacts.
#
# Why this exists: upstream Release/CI jobs use private Blacksmith runners and
# org-only relay/npm config, so they never start on personal forks.
#
# In-app updates:
#   Builds bake T3CODE_DESKTOP_UPDATE_REPOSITORY=$GITHUB_REPOSITORY into the app, so
#   "T3 Code Adi" checks this fork's releases (not pingdotgg/t3code).
#   Releases MUST be full (non-prerelease) + latest so electron-updater's
#   /releases/latest endpoint can find them on the "latest" channel.
#
# T3 Connect:
#   Copies .env.example to .env so the production Clerk/relay public identifiers
#   are baked into both the CLI package and the desktop bundle.
#
# Remote CLI:
#   Desktop SSH launch installs @adithyasak/t3@<this version>. npm is published
#   first so that package exists before the desktop artifacts are released.
#
# Usage:
#   1. Actions → "Personal Release" → Run workflow (same version for npm + Mac + Win)
#   2. Or push a tag: personal-v0.0.33-adi.3
#   3. First install: download the DMG or NSIS from the GitHub Release once
#   4. Later versions: open T3 Code Adi → Check for Updates
name: Personal Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Shared version for npm + Mac + Windows (e.g. 0.0.33-adi.2). Empty = package.json version + -adi.<run_number>"
        required: false
        type: string
      arch:
        description: "macOS architecture to build"
        required: false
        default: arm64
        type: choice
        options:
          - arm64
          - x64
      product_name:
        description: "Desktop product name (side-by-side with official app)"
        required: false
        default: T3 Code Adi
        type: string
      app_id:
        description: "App / bundle id (must differ from official com.t3tools.t3code)"
        required: false
        default: com.t3tools.t3code.adi
        type: string
      skip_npm:
        description: "Skip npm publish (desktop-only; versions will drift)"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "personal-v*"

# Do not run on the upstream org (they have their own Release workflow).
# Safe for personal forks that lack Blacksmith runners.
permissions:
  contents: write
  id-token: write

jobs:
  meta:
    name: Resolve shared release version
    if: github.repository_owner != 'pingdotgg'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      arch: ${{ steps.meta.outputs.arch }}
      product_name: ${{ steps.meta.outputs.product_name }}
      app_id: ${{ steps.meta.outputs.app_id }}
      release_name: ${{ steps.meta.outputs.release_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: meta
        name: Resolve release metadata
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_ARCH: ${{ github.event.inputs.arch }}
          INPUT_PRODUCT_NAME: ${{ github.event.inputs.product_name }}
          INPUT_APP_ID: ${{ github.event.inputs.app_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == personal-v* ]]; then
            version="${GITHUB_REF_NAME#personal-v}"
            arch="arm64"
            product_name="T3 Code Adi"
            app_id="com.t3tools.t3code.adi"
          else
            package_version="$(node -p "require('./apps/desktop/package.json').version")"
            version="${INPUT_VERSION:-}"
            if [[ -z "${version}" ]]; then
              version="${package_version}-adi.${RUN_NUMBER}"
            fi
            version="${version#v}"
            arch="${INPUT_ARCH:-arm64}"
            product_name="${INPUT_PRODUCT_NAME:-T3 Code Adi}"
            app_id="${INPUT_APP_ID:-com.t3tools.t3code.adi}"
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "Invalid version '${version}'. Expected semver-like value (e.g. 0.0.33-adi.2)." >&2
            exit 1
          fi

          tag="personal-v${version}"
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "arch=${arch}"
            echo "product_name=${product_name}"
            echo "app_id=${app_id}"
            echo "release_name=T3 Code Adi ${version}"
          } >> "${GITHUB_OUTPUT}"

          echo "Personal release:"
          echo "  version=${version}"
          echo "  tag=${tag}"
          echo "  package=@adithyasak/t3@${version}"
          echo "  arch=${arch}"
          echo "  product_name=${product_name}"
          echo "  app_id=${app_id}"

  publish_cli:
    name: Publish @adithyasak/t3
    needs: meta
    if: github.repository_owner != 'pingdotgg' && github.event.inputs.skip_npm != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      T3CODE_CLI_PACKAGE_NAME: "@adithyasak/t3"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3...
              - --filter=@t3tools/web...
              - --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.meta.outputs.version }}"

      - name: Bake production T3 Connect public config
        run: cp .env.example .env

      - name: Build web + CLI packages
        run: vp run --filter t3 build

      - name: Confirm Connect public config is baked into the CLI
        shell: bash
        run: |
          set -euo pipefail
          bin="apps/server/dist/bin.mjs"
          if [[ ! -f "$bin" ]]; then
            echo "Missing $bin" >&2
            exit 1
          fi
          for needle in "relay.t3.codes" "pk_live_" "hzxSgY2cH10sDU2r"; do
            if ! grep -q "$needle" "$bin"; then
              echo "CLI bundle is missing T3 Connect public config (${needle})." >&2
              exit 1
            fi
          done
          echo "Baked T3 Connect public identifiers into $bin"

          if grep -q 'node_modules/t3/dist/bin.mjs' "$bin" || grep -q 'node_modules", "t3", "dist"' "$bin"; then
            echo "CLI bundle still hardcodes unscoped node_modules/t3." >&2
            exit 1
          fi
          if ! grep -q '@adithyasak' "$bin"; then
            echo "CLI bundle is missing the scoped @adithyasak/t3 install path." >&2
            exit 1
          fi
          echo "CLI bundle resolves the scoped @adithyasak/t3 runtime"

      - id: pack
        name: Pack CLI with resolved catalog dependencies
        run: >
          node apps/server/scripts/cli.ts pack
          --app-version "${{ needs.meta.outputs.version }}"
          --package-name "${{ env.T3CODE_CLI_PACKAGE_NAME }}"
          --repository-url "https://github.com/${{ github.repository }}"
          --output-dir "${{ runner.temp }}/npm-pack"
          --verbose

      - name: Inspect packed package
        shell: bash
        run: |
          set -euo pipefail
          tarball="${{ steps.pack.outputs.tarball }}"
          if [[ -z "$tarball" || ! -f "$tarball" ]]; then
            echo "Pack step did not produce a tarball." >&2
            exit 1
          fi
          echo "Packed tarball: $tarball"
          python3 - <<'PY'
          import json, os, tarfile
          tarball = os.environ["TARBALL"]
          expected_name = os.environ["EXPECTED_NAME"]
          expected_version = os.environ["EXPECTED_VERSION"]
          with tarfile.open(tarball, "r:gz") as archive:
              member = archive.extractfile("package/package.json")
              if member is None:
                  raise SystemExit("package/package.json missing from tarball")
              manifest = json.load(member)
          print(json.dumps({
              "name": manifest.get("name"),
              "version": manifest.get("version"),
              "bin": manifest.get("bin"),
              "repository": manifest.get("repository"),
              "dependencies": manifest.get("dependencies"),
          }, indent=2))
          if manifest.get("name") != expected_name:
              raise SystemExit(f"expected name {expected_name}, got {manifest.get('name')}")
          if manifest.get("version") != expected_version:
              raise SystemExit(f"expected version {expected_version}, got {manifest.get('version')}")
          if manifest.get("bin", {}).get("t3") != "./dist/bin.mjs":
              raise SystemExit(f"expected bin.t3=./dist/bin.mjs, got {manifest.get('bin')}")
          for name, spec in (manifest.get("dependencies") or {}).items():
              if isinstance(spec, str) and (spec.startswith("catalog:") or spec.startswith("workspace:")):
                  raise SystemExit(f"{name} still has unresolved spec {spec}")
          PY
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          EXPECTED_NAME: ${{ env.T3CODE_CLI_PACKAGE_NAME }}
          EXPECTED_VERSION: ${{ needs.meta.outputs.version }}

      - name: Setup npm for Trusted Publishing
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          registry-url: https://registry.npmjs.org

      - name: Ensure npm CLI supports OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Publish packed package
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public --tag latest --provenance

  build_and_release:
    name: Build macOS DMG + publish release
    needs: [meta, publish_cli]
    if: ${{ !cancelled() && needs.meta.result == 'success' && (needs.publish_cli.result == 'success' || needs.publish_cli.result == 'skipped') }}
    runs-on: macos-latest
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
      T3CODE_CLI_PACKAGE_NAME: "@adithyasak/t3"
      # Unsigned personal builds have no Apple application-identifier entitlement.
      T3CODE_DESKTOP_PASSKEYS: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.meta.outputs.version }}"

      - name: Bake production T3 Connect public config
        run: cp .env.example .env

      - name: Build unsigned macOS DMG
        env:
          T3CODE_DESKTOP_APP_ID: ${{ needs.meta.outputs.app_id }}
          T3CODE_DESKTOP_PRODUCT_NAME: ${{ needs.meta.outputs.product_name }}
        run: |
          vp run dist:desktop:artifact \
            --platform mac \
            --target dmg \
            --arch "${{ needs.meta.outputs.arch }}" \
            --build-version "${{ needs.meta.outputs.version }}" \
            --verbose

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          copied=0
          for pattern in \
            "release/*.dmg" \
            "release/*.zip" \
            "release/*.blockmap" \
            "release/*.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
              copied=$((copied + 1))
            done
          done
          if [[ "${copied}" -eq 0 ]]; then
            echo "No desktop artifacts found under release/" >&2
            ls -la release || true
            exit 1
          fi
          ls -lah release-publish

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.meta.outputs.release_name }}
          body: |
            Personal unsigned desktop build from `${{ github.sha }}`.

            - Product: `${{ needs.meta.outputs.product_name }}`
            - Bundle / app id: `${{ needs.meta.outputs.app_id }}`
            - macOS: `${{ needs.meta.outputs.arch }}` DMG
            - Windows: `x64` NSIS
            - npm: `@adithyasak/t3@${{ needs.meta.outputs.version }}`

            macOS: if Gatekeeper blocks the app, right-click → Open.
            Windows: if SmartScreen warns, choose More info → Run anyway.

            After the first install, later personal builds appear as in-app updates
            (this release is a full "latest" so electron-updater can find it).
          prerelease: false
          make_latest: true
          files: |
            release-publish/*.dmg
            release-publish/*.zip
            release-publish/*.blockmap
            release-publish/*.yml
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}

  # node-pty publishes no Linux prebuild; the WSL backend needs a Linux pty.node
  # shipped inside the Windows installer (same approach as upstream release.yml).
  build_wsl_node_pty:
    name: Build WSL node-pty (linux-x64)
    needs: meta
    if: github.repository_owner != 'pingdotgg'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3...

      - name: Build node-pty linux-x64 prebuild
        shell: bash
        run: |
          set -euo pipefail
          pty_pkg="$(node -e "console.log(require.resolve('node-pty/package.json', { paths: ['$GITHUB_WORKSPACE/apps/server'] }))")"
          pty_dir="$(dirname "$pty_pkg")"
          ( cd "$pty_dir" && npx --yes node-gyp rebuild )
          mkdir -p wsl-prebuild
          cp "$pty_dir/build/Release/pty.node" wsl-prebuild/pty.node
          file wsl-prebuild/pty.node

      - name: Upload node-pty linux-x64 prebuild
        uses: actions/upload-artifact@v7
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild/pty.node
          if-no-files-found: error

  build_windows:
    name: Build Windows NSIS + publish release
    needs: [meta, publish_cli, build_wsl_node_pty]
    if: ${{ !cancelled() && needs.meta.result == 'success' && needs.build_wsl_node_pty.result == 'success' && (needs.publish_cli.result == 'success' || needs.publish_cli.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
      T3CODE_CLI_PACKAGE_NAME: "@adithyasak/t3"
      T3CODE_DESKTOP_PASSKEYS: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bake production T3 Connect public config
        shell: bash
        run: cp .env.example .env

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.meta.outputs.version }}"

      - name: Download WSL node-pty prebuild
        uses: actions/download-artifact@v7
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild

      - name: Install Spectre-mitigated MSVC libs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          if (-not $installPath) {
            Write-Error "Visual Studio installation not found."
            exit 1
          }
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Tools.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Build unsigned Windows NSIS
        shell: bash
        env:
          T3CODE_DESKTOP_APP_ID: ${{ needs.meta.outputs.app_id }}
          T3CODE_DESKTOP_PRODUCT_NAME: ${{ needs.meta.outputs.product_name }}
        run: |
          set -euo pipefail
          vp run dist:desktop:artifact \
            --platform win \
            --target nsis \
            --arch x64 \
            --build-version "${{ needs.meta.outputs.version }}" \
            --wsl-prebuild "$GITHUB_WORKSPACE/wsl-prebuild/pty.node" \
            --verbose

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          copied=0
          for pattern in \
            "release/*.exe" \
            "release/*.blockmap" \
            "release/*.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
              copied=$((copied + 1))
            done
          done
          if [[ "${copied}" -eq 0 ]]; then
            echo "No desktop artifacts found under release/" >&2
            ls -la release || true
            exit 1
          fi
          ls -lah release-publish

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.meta.outputs.release_name }}
          body: |
            Personal unsigned desktop build from `${{ github.sha }}`.

            - Product: `${{ needs.meta.outputs.product_name }}`
            - Bundle / app id: `${{ needs.meta.outputs.app_id }}`
            - macOS: `${{ needs.meta.outputs.arch }}` DMG
            - Windows: `x64` NSIS
            - npm: `@adithyasak/t3@${{ needs.meta.outputs.version }}`

            macOS: if Gatekeeper blocks the app, right-click → Open.
            Windows: if SmartScreen warns, choose More info → Run anyway.

            After the first install, later personal builds appear as in-app updates
            (this release is a full "latest" so electron-updater can find it).
          prerelease: false
          make_latest: true
          files: |
            release-publish/*.exe
            release-publish/*.blockmap
            release-publish/*.yml
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}
